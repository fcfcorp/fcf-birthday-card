<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCF Letter Card</title>
  <style>
    :root {
      --ink: #182337;
      --muted: #667085;
      --paper: #fffaf2;
      --envelope: #f3dec4;
      --envelope-dark: #e3c39d;
      --gold: #b68a45;
      --line: rgba(24, 35, 55, 0.16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #eef5ef, #fff2e1);
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .demo {
      display: grid;
      gap: 22px;
      justify-items: center;
      width: min(94vw, 620px);
    }

    .scene {
      position: relative;
      width: min(100%, 560px);
      height: 780px;
      overflow: hidden;
      perspective: 1100px;
      --letter-out-y: -292px;
      cursor: pointer;
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 10;
      width: min(84vw, 460px);
      min-height: 300px;
      border: 2px solid rgba(182, 138, 69, 0.5);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 26px 70px rgba(24, 35, 55, 0.2);
      transform: translateX(-50%) translateY(205px) scale(0.82);
      transform-origin: center bottom;
    }

    .letter-art {
      min-height: 180px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      padding: 28px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(182, 138, 69, 0.08), rgba(255, 255, 255, 0) 48%),
        #fff;
    }

    .card-logo {
      width: min(62%, 230px);
      height: auto;
      display: block;
    }

    .kicker {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6vw, 48px);
      line-height: 0.95;
      font-weight: 500;
      color: var(--ink);
    }

    .letter-message {
      padding: 18px 26px 22px;
      display: grid;
      gap: 10px;
      text-align: center;
      color: var(--ink);
      background: #fff;
      border-top: 1px solid rgba(182, 138, 69, 0.32);
    }

    .letter-message p {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.5;
      color: rgba(24, 35, 55, 0.84);
    }

    .signature {
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
    }

    .envelope {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 4;
      width: min(92vw, 520px);
      height: 286px;
      transform: translateX(-50%);
      overflow: visible;
    }

    .back {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 0 0 8px 8px;
      background: #d4aa5f;
      box-shadow: 0 26px 70px rgba(24, 35, 55, 0.18);
    }

    .flap {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 8;
      width: 100%;
      height: 168px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform: translateX(-50%) rotateX(0deg);
      transform-origin: top center;
      transform-style: preserve-3d;
      filter: drop-shadow(0 10px 14px rgba(24, 35, 55, 0.12));
    }

    .flap::before,
    .flap::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .flap::before {
      background: linear-gradient(180deg, #f5e3cc, var(--envelope-dark));
      opacity: 1;
    }

    .flap::after {
      background: #c9953f;
      opacity: 0;
    }

    .front {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 12;
      width: min(92vw, 520px);
      height: 286px;
      transform: translateX(-50%);
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      pointer-events: none;
      background: var(--envelope);
      clip-path: polygon(0 0, 50% 59%, 100% 0, 100% 100%, 0 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        0 -1px 0 rgba(24, 35, 55, 0.08);
    }

    .front::before,
    .front::after {
      content: none;
    }

    .seal {
      position: absolute;
      left: 50%;
      bottom: 90px;
      z-index: 20;
      width: 88px;
      height: 88px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      padding: 12px;
      background: #fff;
      border: 2px solid var(--ink);
      box-shadow: 0 10px 24px rgba(24, 35, 55, 0.16);
    }

    .seal img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: translate(1.5px, -1px);
    }

    .scene.playing .flap {
      animation: flapOpen 1050ms cubic-bezier(.32, 0, .18, 1) forwards;
    }

    .scene.playing .flap::before {
      animation: flapFrontFace 1050ms steps(1, end) forwards;
    }

    .scene.playing .flap::after {
      animation: flapBackFace 1050ms steps(1, end) forwards;
    }

    .scene.playing .seal {
      animation: sealFade 300ms ease forwards;
    }

    .scene.playing .letter {
      animation: letterOut 1850ms cubic-bezier(.16, .86, .24, 1) 780ms forwards;
    }

    .scene.paper-front .letter {
      z-index: 30;
    }

    @keyframes flapOpen {
      0% {
        transform: translateX(-50%) rotateX(0deg);
        filter: drop-shadow(0 10px 14px rgba(24, 35, 55, 0.12));
      }
      100% {
        transform: translateX(-50%) rotateX(180deg);
        filter: drop-shadow(0 -10px 16px rgba(24, 35, 55, 0.1));
      }
    }

    @keyframes flapFrontFace {
      0%, 31% {
        opacity: 1;
      }
      32%, 100% {
        opacity: 0;
      }
    }

    @keyframes flapBackFace {
      0%, 31% {
        opacity: 0;
      }
      32%, 100% {
        opacity: 1;
      }
    }

    @keyframes sealFade {
      to {
        opacity: 0;
      }
    }

    @keyframes letterOut {
      0% {
        transform: translateX(-50%) translateY(205px) scale(0.82);
      }
      45% {
        transform: translateX(-50%) translateY(94px) scale(0.9);
      }
      78% {
        transform: translateX(-50%) translateY(calc(var(--letter-out-y) - 24px)) scale(1.06);
      }
      100% {
        transform: translateX(-50%) translateY(var(--letter-out-y)) scale(1.08);
      }
    }

    .click-prompt {
      margin: -10px 0 0;
      color: var(--ink);
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 850px) {
      .app {
        display: block;
      }

      .stage {
        min-height: auto;
        padding: 24px 14px;
      }
    }

    @media (max-width: 560px) {
      .scene {
        height: 720px;
        --letter-out-y: -252px;
      }

      .letter {
        min-height: 286px;
      }

      .letter-art {
        min-height: 168px;
      }

      .envelope {
        height: 244px;
      }

      .front {
        height: 244px;
      }

      .flap {
        top: 0;
        height: 142px;
      }

      .seal {
        bottom: 64px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="Birthday card">
      <div class="demo">
        <div class="scene" id="scene" role="button" tabindex="0" aria-label="Open birthday letter">
          <article class="letter" aria-live="polite">
            <div class="letter-art">
              <img class="card-logo" src="assets/FCF_WFM_Logo_Web_V2.png" alt="First Capital Financial">
              <h1 id="cardHeadline">Happy birthday</h1>
            </div>
            <div class="letter-message">
              <p id="cardMessage">Wishing you a wonderful birthday and a great year ahead.</p>
              <div class="signature" id="cardSignature">From all of us at First Capital Financial</div>
            </div>
          </article>

          <div class="envelope" aria-hidden="true">
            <div class="back"></div>
            <div class="flap"></div>
          </div>
          <div class="front" aria-hidden="true"></div>
          <div class="seal" aria-hidden="true">
            <img src="assets/FCFLOGO.png" alt="">
          </div>
        </div>

        <p class="click-prompt">click!</p>
      </div>
    </section>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const cardHeadline = document.getElementById("cardHeadline");
    let layerTimer;

    function getRecipientName() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || params.get("firstName");
      return name ? name.trim().slice(0, 40) : "";
    }

    function personalizeCard() {
      const name = getRecipientName();
      cardHeadline.textContent = name ? `Happy birthday, ${name}` : "Happy birthday";
    }

    function playLetter() {
      clearTimeout(layerTimer);
      scene.classList.remove("playing");
      scene.classList.remove("paper-front");
      void scene.offsetWidth;
      scene.classList.add("playing");
      layerTimer = setTimeout(() => scene.classList.add("paper-front"), 1900);
    }

    scene.addEventListener("click", playLetter);
    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        playLetter();
      }
    });
    personalizeCard();
  </script>
</body>
</html>
