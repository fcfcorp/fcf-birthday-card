<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCF Letter Card</title>
  <style>
    :root {
      --ink: #284050;
      --green: #708048;
      --gold: #A09058;
      --gray: #53565B;
      --blue: #0090BF;
      --white: #fff;
      --paper: var(--white);
      --envelope: #F0ECE0;
      --envelope-inside: #E5DDC8;
      --envelope-dark: #D8CEB4;
      --muted: var(--gray);
      --line: rgba(40, 64, 80, 0.16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, rgba(112, 128, 72, 0.1), rgba(160, 144, 88, 0.12));
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .demo {
      display: grid;
      gap: 22px;
      justify-items: center;
      width: min(94vw, 620px);
    }

    .scene {
      position: relative;
      width: min(100%, 560px);
      height: 780px;
      overflow: hidden;
      perspective: 1100px;
      --letter-out-y: -292px;
      cursor: pointer;
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 10;
      width: min(84vw, 460px);
      aspect-ratio: 1484 / 1060;
      border: 1px solid rgba(40, 64, 80, 0.14);
      border-radius: 4px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 10px 22px rgba(40, 64, 80, 0.08);
      transform: translateX(-50%) translateY(205px) scale(0.82);
      transform-origin: center bottom;
    }

    .card-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-name {
      position: absolute;
      left: 50%;
      top: 58%;
      width: 44%;
      margin: 0;
      padding: 0.12em 0;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 4vw, 34px);
      font-style: italic;
      line-height: 1;
      font-weight: 600;
      color: var(--ink);
    }

    .card-advisor {
      position: absolute;
      left: 50%;
      top: 86%;
      width: 48%;
      margin: 0;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10px, 1.8vw, 16px);
      line-height: 1.25;
      font-weight: 500;
      color: var(--ink);
    }

    h1 {
      margin: 0;
      max-width: 16ch;
      font-family: inherit;
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.08;
      font-weight: 700;
      color: var(--ink);
    }

    .envelope {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 4;
      width: min(92vw, 520px);
      height: 286px;
      transform: translateX(-50%);
      overflow: visible;
    }

    .back {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 0 0 8px 8px;
      background: var(--envelope-inside);
      box-shadow: 0 16px 34px rgba(40, 64, 80, 0.1);
    }

    .flap {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 8;
      width: 100%;
      height: 168px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform: translateX(-50%) rotateX(0deg);
      transform-origin: top center;
      transform-style: preserve-3d;
      filter: none;
    }

    .flap::before,
    .flap::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .flap::before {
      background: linear-gradient(180deg, var(--envelope), var(--envelope-dark));
      opacity: 1;
    }

    .flap::after {
      background: var(--envelope-inside);
      opacity: 0;
    }

    .front {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 12;
      width: min(92vw, 520px);
      height: 286px;
      transform: translateX(-50%);
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      pointer-events: none;
      background: var(--envelope);
      clip-path: polygon(0 0, 50% 59%, 100% 0, 100% 100%, 0 100%);
      box-shadow: 0 1px 0 rgba(40, 64, 80, 0.08);
    }

    .front::before,
    .front::after {
      content: none;
    }

    .seal {
      position: absolute;
      left: 50%;
      bottom: 90px;
      z-index: 20;
      width: 88px;
      height: 88px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      padding: 12px;
      background: var(--white);
      border: 2px solid var(--ink);
      box-shadow: 0 8px 18px rgba(40, 64, 80, 0.08);
    }

    .seal img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      place-self: center;
      object-fit: contain;
      object-position: center;
    }

    .scene.playing .flap {
      animation: flapOpen 1050ms cubic-bezier(.32, 0, .18, 1) forwards;
    }

    .scene.playing .flap::before {
      animation: flapFrontFace 1050ms steps(1, end) forwards;
    }

    .scene.playing .flap::after {
      animation: flapBackFace 1050ms steps(1, end) forwards;
    }

    .scene.playing .seal {
      animation: sealFade 300ms ease forwards;
    }

    .scene.playing .letter {
      animation: letterOut 1850ms cubic-bezier(.16, .86, .24, 1) 780ms forwards;
    }

    .scene.paper-front .letter {
      z-index: 30;
    }

    @keyframes flapOpen {
      0% {
        transform: translateX(-50%) rotateX(0deg);
        filter: none;
      }
      100% {
        transform: translateX(-50%) rotateX(180deg);
        filter: none;
      }
    }

    @keyframes flapFrontFace {
      0%, 31% {
        opacity: 1;
      }
      32%, 100% {
        opacity: 0;
      }
    }

    @keyframes flapBackFace {
      0%, 31% {
        opacity: 0;
      }
      32%, 100% {
        opacity: 1;
      }
    }

    @keyframes sealFade {
      to {
        opacity: 0;
      }
    }

    @keyframes letterOut {
      0% {
        transform: translateX(-50%) translateY(205px) scale(0.82);
      }
      45% {
        transform: translateX(-50%) translateY(94px) scale(0.9);
      }
      78% {
        transform: translateX(-50%) translateY(calc(var(--letter-out-y) - 24px)) scale(1.06);
      }
      100% {
        transform: translateX(-50%) translateY(var(--letter-out-y)) scale(1.08);
      }
    }

    .click-prompt {
      margin: -10px 0 0;
      color: var(--ink);
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 850px) {
      .app {
        display: block;
      }

      .stage {
        min-height: auto;
        padding: 24px 14px;
      }
    }

    @media (max-width: 560px) {
      .scene {
        height: 720px;
        --letter-out-y: -252px;
      }

      .letter {
        min-height: 0;
      }

      .envelope {
        height: 244px;
      }

      .front {
        height: 244px;
      }

      .flap {
        top: 0;
        height: 142px;
      }

      .seal {
        bottom: 64px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="Birthday card">
      <div class="demo">
        <div class="scene" id="scene" role="button" tabindex="0" aria-label="Open birthday letter">
          <article class="letter" aria-live="polite">
            <img class="card-image" src="assets/birthday-card-template.png" alt="Happy birthday from First Capital Financial">
            <h1 class="card-name" id="cardHeadline">there,</h1>
            <p class="card-advisor" id="cardAdvisor">From First Capital Financial</p>
          </article>

          <div class="envelope" aria-hidden="true">
            <div class="back"></div>
            <div class="flap"></div>
          </div>
          <div class="front" aria-hidden="true"></div>
          <div class="seal" aria-hidden="true">
            <img src="assets/fcflogostamp.png" alt="">
          </div>
        </div>

        <p class="click-prompt">click!</p>
      </div>
    </section>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const cardHeadline = document.getElementById("cardHeadline");
    const cardAdvisor = document.getElementById("cardAdvisor");
    let layerTimer;

    function getRecipientName() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || params.get("firstName");
      return name ? name.trim().slice(0, 40) : "";
    }

    function getAdvisorName() {
      const params = new URLSearchParams(window.location.search);
      const advisor = params.get("advisorname") || params.get("advisorName") || params.get("advisor") || params.get("from");
      return advisor ? advisor.trim().slice(0, 60) : "";
    }

    function personalizeCard() {
      const name = getRecipientName();
      const advisor = getAdvisorName();
      cardHeadline.textContent = name ? `${name},` : "there,";
      cardAdvisor.textContent = advisor ? `From ${advisor}` : "From First Capital Financial";
    }

    function playLetter() {
      clearTimeout(layerTimer);
      scene.classList.remove("playing");
      scene.classList.remove("paper-front");
      void scene.offsetWidth;
      scene.classList.add("playing");
      layerTimer = setTimeout(() => scene.classList.add("paper-front"), 1900);
    }

    scene.addEventListener("click", playLetter);
    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        playLetter();
      }
    });
    personalizeCard();
  </script>
</body>
</html>
